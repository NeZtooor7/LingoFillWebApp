services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: lingofill-db:local
    environment:
      POSTGRES_DB: ${DB_NAME:-lingofill}
      POSTGRES_USER: ${DB_USER:-lingofill_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
